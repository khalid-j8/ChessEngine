<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>insane engine</title>
    <link rel="icon" href="img/favicon.ico">

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU" crossorigin="anonymous">

    <style>
        body { font-family: system-ui, sans-serif; margin: 24px 16px; }
        #myBoard { width: min(400px, 100%); }
        .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
        #status { margin-top: 12px; min-height: 1.4em; }
    </style>
</head>

<body>
    <h1>My insane chess engine</h1>

    <div class="controls">
        <label>Play as
            <select id="color">
                <option value="w" selected>White</option>
                <option value="b">Black</option>
            </select>
        </label>
        <label>Difficulty
            <select id="difficulty">
                <option value="easy">Easy (0.5 s)</option>
                <option value="medium" selected>Medium (2 s)</option>
                <option value="hard">Hard (5 s)</option>
            </select>
        </label>
        <button id="newGame">New game</button>
    </div>

    <div id="myBoard"></div>
    <div id="status"></div>

    <p><a href="https://github.com/khalid-j8/ChessEngine">Source code on GitHub</a></p>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js" integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js" integrity="sha384-s3XgLpvmHyscVpijnseAmye819Ee3yaGa8NxstkJVyA6nuDFjt59u1QvuEl/mecz" crossorigin="anonymous"></script>

    <script src="main.js"></script>
</body>
</html>
